name: enterprise-ai-analyst

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_ai_analyst_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=false
      - LOG_LEVEL=INFO
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai_analyst
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=20
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - INFRASTRUCTURE_STARTUP_RETRIES=5
      - INFRASTRUCTURE_RETRY_DELAY=2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ai_analyst_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: enterprise_ai_analyst_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=enterprise_ai_analyst
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_analyst_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: enterprise_ai_analyst_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ai_analyst_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_ai_analyst_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_analyst_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: enterprise_ai_analyst_postgres_data
  qdrant_data:
    name: enterprise_ai_analyst_qdrant_data

networks:
  ai_analyst_network:
    name: enterprise_ai_analyst_network
    driver: bridge
