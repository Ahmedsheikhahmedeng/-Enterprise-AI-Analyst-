# ==============================================================================
# Enterprise AI Analyst - Local Development Docker Compose Stack
# ==============================================================================

name: enterprise-ai-analyst-dev

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend/Dockerfile
    container_name: analyst_dev_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../../backend/app:/app/app:ro
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_ai_analyst
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - INFRASTRUCTURE_STARTUP_RETRIES=5
      - INFRASTRUCTURE_RETRY_DELAY=1.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - dev_net

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: analyst_dev_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - dev_net

  postgres:
    image: postgres:16.4-alpine
    container_name: analyst_dev_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=enterprise_ai_analyst
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      - dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: analyst_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - dev_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: analyst_dev_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - dev_qdrant_data:/qdrant/storage
    networks:
      - dev_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  dev_net:
    name: analyst_dev_net
    driver: bridge

volumes:
  dev_postgres_data:
  dev_qdrant_data:
