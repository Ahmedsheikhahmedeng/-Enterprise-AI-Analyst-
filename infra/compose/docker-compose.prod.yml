# ==============================================================================
# Enterprise AI Analyst - Production Docker Compose Stack
# Hardened multi-tier network segmentation, non-root, pinned services
# ==============================================================================

name: enterprise-ai-analyst-prod

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND TIER (Public Ingress)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    image: enterprise-ai-analyst-frontend:${IMAGE_TAG:-latest}
    container_name: analyst_prod_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
          pids: 100
        reservations:
          cpus: "0.25"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # 2. BACKEND API TIER (Internal Ingress)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/backend/Dockerfile
    image: enterprise-ai-analyst-backend:${IMAGE_TAG:-latest}
    container_name: analyst_prod_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-analyst_prod_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-enterprise_ai_analyst_prod}
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=30
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - INFRASTRUCTURE_STARTUP_RETRIES=5
      - INFRASTRUCTURE_RETRY_DELAY=2.0
      - PROMETHEUS_METRICS_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/platform/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 200
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # 3. BACKGROUND WORKER TIER
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/worker/Dockerfile
    image: enterprise-ai-analyst-worker:${IMAGE_TAG:-latest}
    container_name: analyst_prod_worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-analyst_prod_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-enterprise_ai_analyst_prod}
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=15
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-8}
      - WORKER_SHUTDOWN_TIMEOUT_SECONDS=30.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - data_net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 150
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ----------------------------------------------------------------------------
  # 4. PERSISTENT STORAGE & BACKING DATA SERVICES (Private Network Only)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    container_name: analyst_prod_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-analyst_prod_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=${POSTGRES_DB:-enterprise_ai_analyst_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst_prod_user} -d ${POSTGRES_DB:-enterprise_ai_analyst_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 200
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7.2-alpine
    container_name: analyst_prod_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --appendonly yes
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
          pids: 100
        reservations:
          cpus: "0.2"
          memory: 128M

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: analyst_prod_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 150
        reservations:
          cpus: "0.5"
          memory: 512M

# ------------------------------------------------------------------------------
# NETWORKS & VOLUMES
# ------------------------------------------------------------------------------
networks:
  frontend_net:
    name: analyst_prod_frontend_net
    driver: bridge
  backend_net:
    name: analyst_prod_backend_net
    driver: bridge
  data_net:
    name: analyst_prod_data_net
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: analyst_prod_postgres_data
  redis_data:
    name: analyst_prod_redis_data
  qdrant_data:
    name: analyst_prod_qdrant_data
