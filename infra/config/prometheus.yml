# ==============================================================================
# Prometheus Scrape Configuration for Enterprise AI Analyst
# Scrapes internal backend metrics without public exposure
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "enterprise_ai_analyst_backend"
    metrics_path: "/api/v1/observability/metrics"
    scheme: "http"
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - target_label: "service"
        replacement: "analyst-backend"
